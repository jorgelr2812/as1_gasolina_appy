<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IA - Consumo y Eficiencia de Combustible</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <h1 class="text-2xl font-bold mb-1 text-cyan-400">Calculadora Inteligente de Trayecto</h1>
        <p class="text-slate-400 text-sm mb-6">Simulación de inferencia de IA para costes, autonomía y eficiencia de combustible.</p>
        
        <form id="tripForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Modelo de Vehículo (Opcional)</label>
                <input type="text" id="modelo" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="Ej: Seat León">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Consumo Medio (L/100km)</label>
                    <input type="number" id="consumo_medio" step="0.1" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="Ej: 6.5">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Capacidad Tanque (L)</label>
                    <input type="number" id="capacidad_tanque" step="0.1" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="Ej: 50">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Distancia Recorrida (km)</label>
                    <input type="number" id="distancia_recorrida" step="0.1" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="Ej: 350">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Combustible Restante (L)</label>
                    <input type="number" id="combustible_restante" step="0.1" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="Ej: 40">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Precio Gasolina (€/L)</label>
                <input type="number" id="precio_gasolina" step="0.01" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="Ej: 1.65">
            </div>

            <div class="flex items-center gap-3 pt-2">
                <input type="checkbox" id="electrico" class="w-4 h-4 text-cyan-500 bg-slate-950 border-slate-800 rounded focus:ring-cyan-500">
                <label class="text-sm font-medium">¿Es un vehículo eléctrico?</label>
            </div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 rounded-lg transition-colors cursor-pointer mt-2">
                Ejecutar Inferencia / Calcular
            </button>
        </form>

        <!-- Contenedor para mostrar los resultados -->
        <div id="resultBox" class="mt-6 hidden bg-slate-950 border border-slate-800 p-5 rounded-xl space-y-3">
            <h2 class="font-semibold text-cyan-400 text-lg border-b border-slate-800 pb-2">Resultado de la Evaluación</h2>
            <div id="resultContent" class="text-sm space-y-2 text-slate-300"></div>
        </div>
    </div>
    <!-- Contenedor para mostrar los resultados -->
<div id="resultBox" class="mt-6 hidden bg-slate-950 border border-slate-800 p-5 rounded-xl space-y-3">
    <h2 class="font-semibold text-cyan-400 text-lg border-b border-slate-800 pb-2">Resultado de la Evaluación</h2>
    <div id="resultContent" class="text-sm space-y-2 text-slate-300"></div>
</div>
    <!-- Script JavaScript modular -->
    <script src="/static/app.js"></script>
</body>
</html>
